name: Release

# Cutting a release is a tag away: `git tag v1.0.0 && git push --tags`.
# The zip attached to the GitHub Release is what people download and load —
# nobody needs to clone the repo or run a build to use ApplyFlow.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # npm provenance signs the package against this workflow run, which is what
  # lets anyone verify the tarball on npm was built from this tag.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Job level, not step level: a step's own `env:` block is not in scope for
    # that step's `if:`, so the guard below would never see the token.
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            extension/package-lock.json
            dashboard/package-lock.json

      # Both projects. The extension's build bundles the dashboard into itself
      # (scripts/bundle-dashboard.mjs), so a checkout with only the extension's
      # dependencies cannot produce a release at all.
      - name: Install
        run: |
          npm ci --prefix extension
          npm ci --prefix dashboard

      # A tagged build that does not typecheck or pass its tests must not ship.
      - name: Check
        working-directory: extension
        run: |
          npm run compile
          npm test

      # The tag is the source of truth for the version; a mismatch means the
      # manifest users install would disagree with the release they downloaded.
      # The manifest reads its version from package.json (see wxt.config.ts),
      # so checking package.json is checking the manifest.
      - name: Verify the tag matches the manifest version
        working-directory: extension
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./package.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $manifest" >&2
            exit 1
          fi
        if: startsWith(github.ref, 'refs/tags/v')

      - name: Build and zip
        working-directory: extension
        run: npm run zip

      # npm is the second way to get it, and the one that needs no browsing to
      # a releases page: `npx applyflow` unpacks the same build.
      #
      # Tokenless by default. npm's trusted publishing exchanges this
      # workflow's OIDC identity for a short-lived credential, so there is no
      # long-lived secret in the repository to leak, rotate or scope — the
      # trust is pinned on npmjs.com to this repo and this workflow file, and
      # nothing else can publish with it. It needs npm 11.5.1+, which is newer
      # than the npm bundled with Node 22, hence the upgrade.
      #
      # NPM_TOKEN is read only if it is set, which covers the first publish of
      # a brand new package: npm cannot pin a trusted publisher to a package
      # that does not exist yet, so either publish that first version by hand
      # or set the secret once and remove it afterwards.
      #
      # Gated on a repository variable rather than on the token, so that a
      # tokenless OIDC setup still runs and a fork's tag does not fail here.
      - name: Publish to npm
        if: vars.NPM_PUBLISH == 'true'
        run: |
          npm install -g npm@latest
          node packaging/npm/build.mjs
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" > ~/.npmrc
          fi
          npm publish packaging/npm --provenance --access public

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: extension/.output/*.zip
          generate_release_notes: true
          body: |
            ## Install

            ```
            npx applyflow
            ```

            Or download `applyflow-*-chrome.zip` below and unzip it.

            Then:

            1. Open `chrome://extensions` (or `brave://extensions`) and turn on **Developer mode**.
            2. Click **Load unpacked** and pick the folder.

            Chrome does not allow an extension to be installed by a script
            unless it came from the Web Store, so those clicks are yours to
            make whichever way you got the folder.

            Your profile stays on your own machine. Nothing is sent anywhere
            unless you set up AI drafting yourself, and then only to the
            provider you chose, on your own API key.
