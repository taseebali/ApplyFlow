<form class="DynamicForm_formContainer">
<div class="DynamicForm_fieldRow">
<div class="name-group-container" role="group" aria-labelledby="name-group-label"><span id="name-group-label" class="form-label">Name<span aria-hidden="true">*</span><span class="sr-only">(erforderlich)</span></span><div class="name-group-inputs"><div class="DynamicForm_halfWidth"><label for="field-first_name" class="sr-only">Vorname</label><input id="field-first_name" type="text" maxlength="255" class="name-group-input" placeholder="Vorname" name="first_name"><div class="DynamicForm_fieldFeedback"></div></div><div class="DynamicForm_halfWidth"><label for="field-last_name" class="sr-only">Nachname</label><input id="field-last_name" type="text" maxlength="255" class="name-group-input" placeholder="Nachname" name="last_name"><div class="DynamicForm_fieldFeedback"></div></div></div></div>
<div class="DynamicForm_fullWidth"><div class="DynamicForm_fieldWrapper"><label for="field-email" class="form-label">E-Mail<span aria-hidden="true">*</span><span class="sr-only">(erforderlich)</span></label><div class="form-control"><input id="field-email" type="email" maxlength="255" class="text-input-field" placeholder="yourmail@domain.com" name="email"><div class="DynamicForm_fieldFeedback"></div></div></div></div>
<div class="DynamicForm_halfWidth"><div class="DynamicForm_fieldWrapper"><label for="field-phone" class="form-label">Telefon</label><div class="form-control"><input id="field-phone" type="text" maxlength="255" class="text-input-field" placeholder="+49 176 123 4455" name="phone"><div class="DynamicForm_fieldFeedback"></div></div></div></div>
<div class="DynamicForm_halfWidth"><div class="DynamicForm_fieldWrapper"><label for="field-available_from" class="form-label">Verfügbar ab<span aria-hidden="true">*</span><span class="sr-only">(erforderlich)</span></label><div class="form-control"><input id="field-available_from" type="text" maxlength="255" class="text-input-field" placeholder="Verfügbar ab" name="available_from"><div class="DynamicForm_fieldFeedback"></div></div></div></div>
<div class="DynamicForm_halfWidth"><div class="DynamicForm_fieldWrapper"><label for="field-salary_expectations" class="form-label">Gehaltsvorstellung<span aria-hidden="true">*</span><span class="sr-only">(erforderlich)</span></label><div class="form-control"><input id="field-salary_expectations" type="text" maxlength="255" class="text-input-field" placeholder="Gehaltsvorstellung" name="salary_expectations"><div class="DynamicForm_fieldFeedback"></div></div></div></div>
</div>
<div class="DynamicForm_sectionSpacing">

<div class="document-field-wrapper" role="group" aria-labelledby="doc-label-other"><div id="doc-label-other" class="DynamicForm_documentCategoryLabel">Andere<span class="DynamicForm_optionalText">(Optional)</span></div><div class="document-input-wrapper"><input id="doc-input-other" type="file" class="DynamicForm_hidden" aria-label="Upload Andere" name="documents.other"></div></div>
</div>
</form>
